<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>회원 목록 - 관리자 시스템</title>
    <style>
        /* 🎨 요구사항에 맞춘 색상 및 레이아웃 설정 */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: sans-serif;
        }

        /* 상단 헤더 */
        header {
            background-color: #1f2937;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 바 */
        nav {
            background-color: #374151;
            padding: 10px 20px;
            color: white;
        }

        /* 메인 컨테이너 (사이드바 + 컨텐츠) */
        .main-container {
            display: flex;
            flex: 1;
        }

        /* 좌측 사이드 메뉴 */
        aside {
            width: 200px;
            background-color: #111827;
            color: white;
            padding: 20px;
        }

        /* 우측 컨텐츠 영역 */
        main {
            flex: 1;
            background-color: #f4f6f9;
            padding: 30px;
            color: #333;
        }

        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .view-btn {
            background: #374151;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <!-- 1. 상단 네비게이션 바 (헤더) -->
    <header>
        <div>관리자 시스템</div>
        <div>사용자님 환영합니다</div>
    </header>

    <!-- 2. 네비게이션 경로 -->
    <nav>Home > 회원 목록</nav>

    <div class="main-container">
        <!-- 3. 좌측 사이드 메뉴 -->
        <aside>
            <div style="margin-bottom: 20px; cursor: pointer;">● 회원 관리</div>
            <div style="cursor: pointer;">● 게시판 관리</div>
        </aside>

        <!-- 4. 우측 컨텐츠 영역 -->
        <main>
            <h2>회원 목록</h2>
            <table>
                <tr>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>관리</th>
                </tr>
                <tr>
                    <td>홍길동</td>
                    <td>hong@example.com</td>
                    <td>
                        <!-- 버튼 클릭 시 아래 자바스크립트 함수 실행 -->
                        <button class="view-btn" onclick="goToDetail()">보기</button>
                    </td>
                </tr>
            </table>
        </main>
    </div>

    <!-- 5. 자바스크립트 로직 -->
    <script>
        function goToDetail() {
            // 요구사항대로 상세 페이지로 이동
            location.href = "user-detail.html";
        }
    </script>

</body>

</html>
