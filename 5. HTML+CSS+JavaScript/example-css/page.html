<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            /* 기본 여백 제거 */
            display: flex;
            /* 플렉스 박스 레이아웃 적용 */
            justify-content: center;
            /* 가로 방향 중앙 정렬 */
            align-items: center;
            /* 세로 방향 중앙 정렬 */
            min-height: 100vh;
            /* 브라우저 화면 높이를 100% 사용 */
            background-color: #121212;
            /* 배경색 유지 */
        }

        /* 로그인 카드를 감싸는 div (예: .login-card) */
        .login-card {
            /* 기존에 작성하신 카드 스타일(너비, 패딩 등)은 그대로 유지하세요 */
            width: 350px;
            padding: 30px;
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<script>
    function loginCheck() {
        // 1. 사용자가 입력한 값을 가져오기
        const userEmail = document.getElementById('email').value;
        const userPw = document.getElementById('pw').value;

        // 2. 조건문 작성 (요구사항 데이터와 비교)
        if (userEmail === "hong@example.com" && userPw === "qwer1234") {

            // 조건이 맞을 때: 회원 목록 페이지로 이동
            alert("로그인 성공!");
            location.href = "user-list.html";

        } else {

            // 조건이 틀릴 때: 경고창 띄우기
            alert("이메일 또는 비밀번호가 일치하지 않습니다.");

        }
    }
</script>

<body>


    <div class="login-card">
        <input type="text" id="email" placeholder="이메일 입력">
        <input type="password" id="pw" placeholder="비밀번호 입력">

        <!-- 클릭하면 loginCheck 함수 실행 -->
        <button onclick="loginCheck()">로그인</button>
    </div>


</body>

</html>
